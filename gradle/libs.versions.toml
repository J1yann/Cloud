[versions]
# android sdk
compileSdk = "36"
targetSdk = "36"
minSdk = "23"
versionCode = "8"
versionName = "0.2.3"
# plugin
agp = "9.0.0"
kotlin = "2.2.10"
ksp = "2.3.6"
hilt = "2.60.1"
# sdk
media3 = "1.11.1"
room = "2.8.5"
common = "1.0.2"
crouter = "3.0.0-beta01"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
gms = { id = "com.google.gms.google-services", version = "4.5.0" }
crashlytics = { id = "com.google.firebase.crashlytics", version = "3.0.8" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }

[libraries]
# plugin
crouter-plugin = { group = "com.github.wangchenyan.crouter", name = "crouter-plugin", version.ref = "crouter" }
# androidx
appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.8.0" }
material = { group = "com.google.android.material", name = "material", version = "1.14.0" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version = "2.2.2" }
flexbox = { group = "com.google.android.flexbox", name = "flexbox", version = "3.0.0" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
room = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
preference = { group = "androidx.preference", name = "preference-ktx", version = "1.2.1" }
glance = { group = "androidx.glance", name = "glance-appwidget", version = "1.2.0" }
# google
crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics-ktx", version = "19.4.4" }
