name: Capture Cloud screenshots

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to capture
        required: true
        default: v0.2.3

permissions:
  contents: read

concurrency:
  group: cloud-screenshots-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUD_RELEASE_TAG: ${{ inputs.tag }}
      CLOUD_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
    steps:
      - uses: actions/checkout@v6

      - name: Download production APK
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLOUD_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/cloud-apk"
          gh release download "$CLOUD_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --pattern '*.apk.sha256' --dir "$RUNNER_TEMP/cloud-apk"
          cd "$RUNNER_TEMP/cloud-apk"
          sha256sum -c ./*.apk.sha256

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Cache emulator packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/emulator
            ${{ env.ANDROID_HOME }}/system-images/android-35/google_apis/x86_64
          key: cloud-screenshots-emulator-v1-${{ runner.os }}-35-google-apis-x86_64

      - name: Enable emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture app screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 .github/scripts/capture_screenshots.py

      - name: Upload screenshot ZIP
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cloud-screenshots-${{ inputs.tag }}
          path: screenshots/
          if-no-files-found: error
          retention-days: 7
