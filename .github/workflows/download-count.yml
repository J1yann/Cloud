name: Update APK download count

on:
  schedule:
    - cron: '17 */6 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloud-download-count
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Count published APK downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/update_download_count.py
      - name: Save updated counter
        shell: bash
        run: |
          if git diff --quiet -- docs/downloads.json; then exit 0; fi
          git config user.name 'Jiyan'
          git config user.email '58224918+J1yann@users.noreply.github.com'
          git add docs/downloads.json
          git commit -m 'Update APK download count' -m '[skip ci]'
          git push origin HEAD:main
